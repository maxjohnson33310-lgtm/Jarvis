<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jarvis</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 0 auto;
      padding: 30px 20px;
      background: #f5f5f5;
    }

    h1 {
      margin-bottom: 5px;
    }

    #chat {
      background: white;
      min-height: 300px;
      padding: 20px;
      border-radius: 12px;
      margin: 20px 0;
    }

    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      resize: vertical;
      font-size: 16px;
    }

    button {
      margin-top: 10px;
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    #send {
      background: #111;
      color: white;
    }

    #photo {
      margin-top: 15px;
    }

    .message {
      margin-bottom: 15px;
    }

    .you {
      font-weight: bold;
    }

    .jarvis {
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>Jarvis</h1>
  <p>Your personal productivity assistant.</p>

  <div id="chat">
    <div class="message">
      <span class="jarvis">Jarvis:</span>
      What do you need?
    </div>
  </div>

  <textarea
    id="message"
    rows="4"
    placeholder="Tell Jarvis what you need..."
  ></textarea>

  <input
    id="photo"
    type="file"
    accept="image/*"
  >

  <br>

  <button id="send">Send</button>

  <script>
    const messageInput = document.getElementById("message");
    const sendButton = document.getElementById("send");
    const chat = document.getElementById("chat");

    sendButton.addEventListener("click", () => {
      const message = messageInput.value.trim();

      if (!message) return;

      chat.innerHTML += `
        <div class="message">
          <span class="you">You:</span>
          ${message}
        </div>
      `;

      chat.innerHTML += `
        <div class="message">
          <span class="jarvis">Jarvis:</span>
          I received your message. My AI brain isn't connected yet.
        </div>
      `;

      messageInput.value = "";
    });
  </script>

</body>
</html>
